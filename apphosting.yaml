# Firebase App Hosting config for the Next.js app (landing + admin panel + student PWA).
# This is the modern replacement for classic Hosting + a manual SSR Cloud Function:
# App Hosting builds and serves Next.js on Cloud Run directly, so `firebase.json` only
# needs to carry Firestore/Storage/Functions config — deploy this with
# `firebase apphosting:backends:create` / the Firebase console's GitHub integration.
runConfig:
  minInstances: 0
  maxInstances: 3
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: REPLACE_ME
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: REPLACE_ME
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: REPLACE_ME
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: REPLACE_ME
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: REPLACE_ME
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: REPLACE_ME
    availability: [BUILD, RUNTIME]
  # Server-only Admin SDK credentials: store the real values as secrets
  # (`firebase apphosting:secrets:set FIREBASE_PRIVATE_KEY`) and reference them here
  # instead of hardcoding — omitted as plain `value` on purpose.
  # - variable: FIREBASE_PROJECT_ID
  #   secret: FIREBASE_PROJECT_ID
  # - variable: FIREBASE_CLIENT_EMAIL
  #   secret: FIREBASE_CLIENT_EMAIL
  # - variable: FIREBASE_PRIVATE_KEY
  #   secret: FIREBASE_PRIVATE_KEY
